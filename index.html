<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- ゴースト空間抹殺のため、ズームとパンを完全封鎖 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>イフリート20号（Pixel 8・ペルソナ搭載型）</title>
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        /* ==========================================
           1. 構造改革：絶対隔離コンテナ
        ========================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100vw; height: 100%; overflow: hidden; position: relative; background-color: #000; }
        
        #app-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100%; 
            background-color: #f4f4f5; display: flex; flex-direction: column; 
            overflow: hidden; color: #595959;
        }
        
        header { height: 50px; flex: none; background-color: #2c3e50; color: #ffffff; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; font-size: 14px; font-weight: bold; position: relative; z-index: 30; -webkit-user-select: none; user-select: none;}
        
        #log-window { flex: 1; background-color: #ffffff; padding: 20px; overflow-y: auto; border-bottom: 2px solid #bdc3c7; -webkit-user-select: text; user-select: text; }
        .log-user, .log-ai { font-family: "MS UI Gothic", "Yu Gothic UI", "Meiryo UI", sans-serif; font-size: 16px; line-height: 1.6; padding-bottom: 25px; margin-bottom: 25px; -webkit-user-select: text; user-select: text; }
        .log-meta { font-size: 12px; color: #737373; margin-bottom: 5px; font-family: sans-serif; display: flex; align-items: center; gap: 5px; -webkit-user-select: none; user-select: none; }
        .log-checkbox { width: 14px; height: 14px; cursor: pointer; }
        
        #input-window { min-height: 70px; flex: none; padding: 10px; background-color: #ecf0f1; display: flex; flex-direction: column; border-top: 1px solid #bdc3c7; }
        textarea#main-input { flex-grow: 1; resize: none; padding: 10px; font-size: 16px; border: 1px solid #95a5a6; border-radius: 5px; color: #595959; outline: none; line-height: 1.5; }
        
        #control-area { height: auto; flex: none; background-color: #ecf0f1; display: flex; justify-content: space-between; align-items: stretch; padding: 0 10px 15px 10px; gap: 15px; -webkit-user-select: none; user-select: none;}
        #radar-panel { display: flex; gap: 10px; font-family: sans-serif; font-size: 12px; color: #595959; flex: 1; align-items: center; }
        .radar-col { display: flex; flex-direction: column; gap: 5px; }
        .radar-item { background: #e0e6ed; padding: 6px 8px; border-radius: 4px; font-weight: bold; white-space: nowrap; }
        
        #toggle-console-btn { touch-action: manipulation; background: #34495e; color: white; border: none; border-radius: 4px; padding: 0 12px; height: 100%; font-size: 18px; font-weight: bold; cursor: pointer; flex: none; }
        
        .btn-send { background-color: #2980b9; color: #ffffff; border: none; border-radius: 5px; width: 80px; font-size: 14px; font-weight: bold; cursor: pointer;}
        .btn-send:disabled { background-color: #7f8c8d; cursor: not-allowed; }
        #timer-container { font-family: monospace; font-size: 14px; font-weight: bold; color: #333333; margin-left: auto; }
        
        /* ==========================================
           2. サイドバー（構造バグ完全封殺版）
        ========================================== */
        #sidebar-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 35; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s; }
        #sidebar-overlay.open { opacity: 1; visibility: visible; }
        
        #sidebar-console { position: absolute; top: 0; left: 0; width: 300px; height: 100%; background-color: #34495e; color: white; transform: translateX(-100%); visibility: hidden; transition: transform 0.3s ease, visibility 0.3s ease; z-index: 40; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; -webkit-user-select: none; user-select: none;}
        #sidebar-console.open { transform: translateX(0); visibility: visible; }
        
        #right-sidebar { position: absolute; top: 0; right: 0; width: 75vw; height: 100%; background-color: #34495e; color: white; transform: translateX(100%); visibility: hidden; transition: transform 0.3s ease, visibility 0.3s ease; z-index: 40; padding: 20px; overflow-y: auto; -webkit-user-select: none; user-select: none;}
        #right-sidebar.open { transform: translateX(0); visibility: visible; }
        
        .console-section { border-bottom: 1px solid #7f8c8d; padding-bottom: 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        .console-title { font-size: 14px; color: #ecf0f1; font-weight: bold; }
        .btn-small { background-color: #2980b9; padding: 10px; border-radius: 5px; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-warning { background-color: #f39c12; color: #fff; padding: 12px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; }
        .btn-danger { background-color: #c0392b; color: #fff; padding: 12px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; }
        .console-textarea { width: 100%; resize: none; padding: 8px; border-radius: 5px; border: none; font-size: 14px; background: #ecf0f1; color: #2c3e50; line-height: 1.4; outline: none; -webkit-user-select: text; user-select: text; }
        input[type=password], select { width: 100%; padding: 10px; border-radius: 5px; border: none; font-size: 13px; background: #ecf0f1; color: #2c3e50; }
        .right-action-row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    </style>
</head>
<body>
<div id="app-container">
    <div id="sidebar-overlay"></div>
    
    <!-- 左舷 (最低限のログ管理と通信設定) -->
    <div id="sidebar-console">
        <div class="console-section">
            <div class="console-title">通信コスト統制（キャッシュ）</div>
            <div id="cache-status-text" style="font-size: 13px; color: #bdc3c7; font-family: monospace;">状態: 未凍結</div>
            <div style="font-size: 13px; color: #ecf0f1; margin-top: 5px;">直近ターン判定: <span id="turn-cache-status">⚪</span></div>
        </div>
        <div class="console-section">
            <div class="console-title">API認証</div>
            <input type="password" id="api-key-input" placeholder="APIキーを入力">
            <div style="display: flex; gap: 8px;">
                <button class="btn-small" id="save-key-btn" style="flex:1;">保存</button>
                <button class="btn-small" id="delete-key-btn" style="flex:1; background: #7f8c8d;">消去</button>
            </div>
        </div>
        <div class="console-section">
            <div class="console-title">歴史の抽出 (チャンク)</div>
            <button class="btn-small" id="chunk-export-btn" style="background-color: #8e44ad;">最古の5万字を退避</button>
        </div>
        <div class="console-section">
            <div class="console-title">ログ管理</div>
            <button class="btn-warning" id="undo-btn">一手やり直し (Undo)</button>
            <button class="btn-warning" id="copy-checked-btn">チェック項目をコピー</button>
            <button class="btn-warning" id="delete-checked-btn">チェック項目を削除(Firebase論理削除)</button>
            <button class="btn-danger" id="reset-btn" style="margin-top: 15px;">全ログ強制消去(ローカルのみ)</button>
        </div>
    </div>

    <!-- 右舷 (ペルソナとプロンプト) -->
    <div id="right-sidebar">
        <div class="console-section">
            <div class="console-title">ペルソナ起動設定</div>
            <select id="persona-select">
                <option value="kanae">穂積かなえ</option>
                <option value="abazure">場末のアバズレOL</option>
            </select>
        </div>
        <div class="console-section" style="flex: 1;">
            <div class="right-action-row">
                <div class="console-title">System Instruction</div>
                <div style="display:flex; gap:8px;">
                    <button class="btn-small btn-action-save" data-target="sys-prompt" style="padding:4px 10px; font-size:12px;">保存(雲へ)</button>
                    <button class="btn-small btn-action-clear" data-target="sys-prompt" style="padding:4px 10px; font-size:12px; background:#7f8c8d;">消去</button>
                </div>
            </div>
            <textarea id="sys-prompt" class="console-textarea" style="flex-grow: 1; min-height: 150px; margin-top: 8px;"></textarea>
        </div>
        <div class="console-section" style="flex: 1; border-bottom: none;">
            <div class="right-action-row">
                <div class="console-title">Saved Information</div>
                <div style="display:flex; gap:8px;">
                    <button class="btn-small btn-action-save" data-target="saved-info" style="padding:4px 10px; font-size:12px;">保存(雲へ)</button>
                    <button class="btn-small btn-action-clear" data-target="saved-info" style="padding:4px 10px; font-size:12px; background:#7f8c8d;">消去</button>
                </div>
            </div>
            <textarea id="saved-info" class="console-textarea" style="flex-grow: 1; min-height: 150px; margin-top: 8px;"></textarea>
        </div>
    </div>

    <header>
        <div style="font-size: 14px;">📱 イフリート20号 <span style="font-size:11px; opacity:0.7;">(クラウド直結)</span></div>
    </header>

    <div id="log-window"></div>

    <div id="input-window">
        <textarea id="main-input" placeholder="こちらにプロトコルを入力してください" rows="1"></textarea>
    </div>

    <div id="control-area">
        <div id="radar-panel">
            <button id="toggle-console-btn">≡</button>
            <div class="radar-col" style="margin-left: 5px;">
                <div class="radar-item">ワルツ: <span id="radar-waltz">0</span></div>
                <div class="radar-item">文字数: <span id="radar-chars">0</span></div>
            </div>
            <button id="reset-meter-btn" style="font-size:10px; padding:0 8px; border:none; border-radius:4px; background:#e0e6ed; color:#595959; margin-left: 5px;">ﾘｾｯﾄ</button>
            <div id="timer-container">0.0秒</div>
        </div>
        <button class="btn-send" id="sendBtn">送 信</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAlz26igDEILsZBL5LrVVynx6KlsKu6e8U",
        authDomain: "sneezer31-78845.firebaseapp.com",
        projectId: "sneezer31-78845",
        storageBucket: "sneezer31-78845.firebasestorage.app",
        messagingSenderId: "1094107940035",
        appId: "1:1094107940035:web:2f5cfbcccf313feac7ce76"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const STORAGE_KEY = "fleet_v20_logs";
    const API_KEY_VAULT = "gemini_api_key";
    const WALTZ_COUNT_VAULT = "gemini_waltz_count_v20";
    
    let chatLogArray = [];
    let sessionWaltzCount = 0;
    
    // UI Elements
    const logArea = document.getElementById("log-window");
    const inputArea = document.getElementById("main-input");
    const sendBtn = document.getElementById("sendBtn");
    const consolePanel = document.getElementById("sidebar-console");
    const rightPanel = document.getElementById("right-sidebar");
    const overlay = document.getElementById("sidebar-overlay");
    const personaSelect = document.getElementById("persona-select");

    // Cache State
    let activeCacheName = null;
    let activeCacheLength = 0;
    let activeCacheExpiry = 0;

    // --- Firebase Persona Loader ---
    async function loadPersona(personaId) {
        let sysPromptEl = document.getElementById("sys-prompt");
        let savedInfoEl = document.getElementById("saved-info");
        sysPromptEl.value = "読み込み中...";
        savedInfoEl.value = "読み込み中...";
        try {
            let docSnap = await getDoc(doc(db, "records", "persona_" + personaId));
            if (docSnap.exists()) {
                let data = docSnap.data();
                sysPromptEl.value = data.sys_prompt || "";
                savedInfoEl.value = data.saved_info || "";
            } else {
                sysPromptEl.value = "";
                savedInfoEl.value = "";
            }
        } catch (e) {
            console.error(e);
            sysPromptEl.value = ""; savedInfoEl.value = "";
        }
    }
    personaSelect.addEventListener("change", function() { loadPersona(this.value); });

    // --- UI Actions ---
    function openSidebar() { consolePanel.classList.add("open"); overlay.classList.add("open"); }
    function openRightSidebar() { rightPanel.classList.add("open"); overlay.classList.add("open"); }
    function closeAllSidebars() { consolePanel.classList.remove("open"); rightPanel.classList.remove("open"); overlay.classList.remove("open"); }
    overlay.onclick = closeAllSidebars;

    let clickTimer = null;
    document.getElementById("toggle-console-btn").addEventListener('click', function() {
        if (clickTimer == null) {
            clickTimer = setTimeout(function() { clickTimer = null; if (!rightPanel.classList.contains("open")) openSidebar(); }, 300); 
        } else {
            clearTimeout(clickTimer); clickTimer = null; if (!consolePanel.classList.contains("open")) openRightSidebar(); 
        }
    });

    let touchStartX = 0, touchStartY = 0, touchEndX = 0, touchEndY = 0;
    document.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].screenX; touchStartY = e.changedTouches[0].screenY; }, {passive: true});
    document.addEventListener('touchend', function(e) { touchEndX = e.changedTouches[0].screenX; touchEndY = e.changedTouches[0].screenY; handleSwipe(); }, {passive: true});
    function handleSwipe() {
        let xDiff = touchStartX - touchEndX;
        let yDiff = Math.abs(touchStartY - touchEndY);
        if (yDiff > Math.abs(xDiff)) return; 
        if (xDiff > 50) { if (consolePanel.classList.contains("open")) closeAllSidebars(); else if (touchStartX > window.innerWidth - 100 && !rightPanel.classList.contains("open")) openRightSidebar(); } 
        else if (xDiff < -50) { if (rightPanel.classList.contains("open")) closeAllSidebars(); else if (touchStartX < 100 && !consolePanel.classList.contains("open")) openSidebar(); }
    }

    inputArea.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px'; });

    // --- Format / Render ---
    function getFormattedTime() {
        let now = new Date(); let yyyy = now.getFullYear(); let mm = ("0" + (now.getMonth() + 1)).slice(-2); let dd = ("0" + now.getDate()).slice(-2);
        let dayStr = ["日", "月", "火", "水", "木", "金", "土"][now.getDay()];
        let hh = ("0" + now.getHours()).slice(-2); let min = ("0" + now.getMinutes()).slice(-2);
        return yyyy + "/" + mm + "/" + dd + "(" + dayStr + ") " + hh + ":" + min;
    }

    function updateRadar() {
        let totalChars = chatLogArray.reduce((acc, log) => acc + log.text.length, 0);
        document.getElementById("radar-waltz").innerText = sessionWaltzCount;
        document.getElementById("radar-chars").innerText = totalChars.toLocaleString();
    }

    function enforceMemoryLimit() {
        let STORAGE_LIMIT = 2000000;
        let totalChars = chatLogArray.reduce((acc, log) => acc + log.text.length, 0);
        while (totalChars > STORAGE_LIMIT && chatLogArray.length >= 2) {
            let dropped1 = chatLogArray.shift(); let dropped2 = chatLogArray.shift(); totalChars -= (dropped1.text.length + dropped2.text.length);
        }
    }

    function buildLogElement(log, index) {
        let wrapper = document.createElement("div"); 
        wrapper.className = log.sender === "User" ? "log-user" : "log-ai";
        let meta = document.createElement("div"); meta.className = "log-meta";
        let cb = document.createElement("input"); cb.type = "checkbox"; cb.className = "log-checkbox"; cb.value = index; meta.appendChild(cb);
        let span = document.createElement("span"); 
        
        let senderName = log.sender === "User" ? "船長" : (log.sender === "kanae" ? "かなえ" : log.sender);
        span.innerHTML = (log.time || "") + " " + senderName + "："; meta.appendChild(span);
        
        let textNode = document.createElement("div"); textNode.style.whiteSpace = "pre-wrap"; textNode.textContent = log.text;
        wrapper.appendChild(meta); wrapper.appendChild(textNode);
        return wrapper;
    }

    function renderLogs() {
        logArea.innerHTML = ""; 
        if (chatLogArray.length === 0) {
            logArea.innerHTML = '<p class="log-empty" style="font-size: 12px; color: #95a5a6;">システム起動：対話ログ待機中...</p>';
            updateRadar(); return;
        }
        let frag = document.createDocumentFragment();
        chatLogArray.forEach(function(log, index) { frag.appendChild(buildLogElement(log, index)); });
        logArea.appendChild(frag);
        logArea.scrollTop = logArea.scrollHeight; updateRadar();
    }

    function appendLogElement(index) {
        let empty = logArea.querySelector(".log-empty");
        if (empty) empty.parentNode.removeChild(empty);
        logArea.appendChild(buildLogElement(chatLogArray[index], index));
        logArea.scrollTop = logArea.scrollHeight; updateRadar();
    }

    function updateCacheUI() {
        let statusText = document.getElementById("cache-status-text");
        if (activeCacheName && activeCacheExpiry > Date.now()) {
            let remainSec = Math.floor((activeCacheExpiry - Date.now()) / 1000);
            let m = Math.floor(remainSec / 60); let s = remainSec % 60;
            statusText.innerText = "凍結中 (" + ("0" + m).slice(-2) + ":" + ("0" + s).slice(-2) + ")";
            statusText.style.color = "#f1c40f";
        } else {
            activeCacheName = null;
            localStorage.removeItem("gemini_cache_name");
            localStorage.removeItem("gemini_cache_length");
            localStorage.removeItem("gemini_cache_expiry");
            statusText.innerText = "状態: 未凍結"; statusText.style.color = "#bdc3c7";
        }
    }

    window.onload = function() {
        let savedJSON = localStorage.getItem(STORAGE_KEY); if (savedJSON) chatLogArray = JSON.parse(savedJSON);
        let savedWaltz = localStorage.getItem(WALTZ_COUNT_VAULT); if (savedWaltz) sessionWaltzCount = parseInt(savedWaltz);
        
        let savedCacheName = localStorage.getItem("gemini_cache_name");
        if (savedCacheName) {
            activeCacheName = savedCacheName;
            activeCacheLength = parseInt(localStorage.getItem("gemini_cache_length")) || 0;
            activeCacheExpiry = parseInt(localStorage.getItem("gemini_cache_expiry")) || 0;
        }
        
        renderLogs();
        if (localStorage.getItem(API_KEY_VAULT)) document.getElementById("api-key-input").value = "********"; 
        setInterval(updateCacheUI, 1000); updateCacheUI();
        
        // 初回ペルソナロード
        loadPersona(personaSelect.value);
    };

    // --- DB & API ---
    async function fetchGeminiAPI(isAutoRetry = false) {
        let apiKey = localStorage.getItem(API_KEY_VAULT); if (!apiKey) { alert("APIキーがありません。"); return null; }

        let sendLogs = chatLogArray.slice();
        while (sendLogs.length > 0 && sendLogs[0].sender !== "User") { sendLogs.shift(); }
        if (sendLogs.length === 0) return null;

        let allContents = [];
        sendLogs.forEach(function(log) {
            let role = log.sender === "User" ? "user" : "model";
            let parts = [{ text: log.text }];
            let lastContent = allContents[allContents.length - 1];
            if (lastContent && lastContent.role === role) { 
                lastContent.parts = lastContent.parts.concat(parts);
            } else { 
                allContents.push({ role: role, parts: parts }); 
            }
        });

        let sysPrompt = document.getElementById("sys-prompt").value || "";
        let savedInfo = document.getElementById("saved-info").value || "";
        let finalInstruction = sysPrompt;
        if (savedInfo.trim() !== "") { finalInstruction += "\n\n[Saved Information]\n" + savedInfo; }
        
        let sysInstObj = finalInstruction.trim() !== "" ? { parts: [{ text: finalInstruction }] } : undefined;
        let historyForCache = allContents.length > 1 ? allContents.slice(0, -1) : [];
        
        if ((!activeCacheName || activeCacheExpiry <= Date.now() || allContents.length < activeCacheLength) && historyForCache.length > 0 && !isAutoRetry) {
            let cacheBody = { model: "models/gemini-3.1-pro-preview", contents: historyForCache, systemInstruction: sysInstObj, ttl: "3600s" };
            try {
                let cacheRes = await fetch("https://generativelanguage.googleapis.com/v1beta/cachedContents?key=" + apiKey, {
                    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cacheBody)
                });
                let cacheData = await cacheRes.json();
                if (cacheData.name) {
                    activeCacheName = cacheData.name; activeCacheExpiry = Date.now() + 3600000; activeCacheLength = historyForCache.length;
                    localStorage.setItem("gemini_cache_name", activeCacheName); localStorage.setItem("gemini_cache_expiry", activeCacheExpiry); localStorage.setItem("gemini_cache_length", activeCacheLength);
                }
            } catch (e) { console.warn("キャッシュ作成失敗。通常通信続行。"); }
        }

        let requestBody = {};
        if (activeCacheName && activeCacheExpiry > Date.now() && allContents.length > activeCacheLength) {
            requestBody.cachedContent = activeCacheName; requestBody.contents = allContents.slice(activeCacheLength);
        } else {
            activeCacheName = null; updateCacheUI(); requestBody.contents = allContents;
            if (sysInstObj) { requestBody.systemInstruction = sysInstObj; }
        }

        let url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-pro-preview:generateContent?key=" + apiKey;
        try {
            let response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(requestBody) });
            let data = await response.json();
            
            if (data.error) {
                if (activeCacheName && !isAutoRetry && (data.error.message.includes("unavailable") || data.error.message.includes("cache") || data.error.message.includes("not found"))) {
                    activeCacheName = null; updateCacheUI(); return await fetchGeminiAPI(true);
                }
                alert("APIエラー: " + data.error.message); return null; 
            }
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                if (data.usageMetadata && document.getElementById("turn-cache-status")) {
                    document.getElementById("turn-cache-status").innerText = (data.usageMetadata.cachedContentTokenCount || 0) > 0 ? "🟢" : "🔴";
                }
                return data.candidates[0].content.parts[0].text;
            } else { return null; }
        } catch (error) { alert("通信沈黙：サーバーへの接続に失敗しました。"); return null; }
    }

    sendBtn.onclick = async function() {
        let text = inputArea.value.trim();
        if (text === "") return;
        
        sendBtn.disabled = true; sendBtn.innerText = "通信中..."; 
        inputArea.value = ""; inputArea.style.height = 'auto';
        
        let startTime = performance.now();
        document.getElementById("timer-container").innerText = "0.0秒";
        let timerInterval = setInterval(() => { document.getElementById("timer-container").innerText = ((performance.now() - startTime) / 1000).toFixed(1) + "秒"; }, 100);
        
        // 船長の送信（User）
        let newLogUser = {
            id: Date.now(),
            app_type: "chat",
            sender: "User",
            time: getFormattedTime(),
            text: text,
            attachedFiles: [],
            tags: [],
            memo: "",
            status: "published",
            linked_ids: [],
            updated_at: Date.now()
        };
        chatLogArray.push(newLogUser); 
        appendLogElement(chatLogArray.length - 1);
        
        // Firebaseへ投下
        setDoc(doc(db, "records", newLogUser.id.toString()), newLogUser).catch(e => console.error(e));

        let aiResponseText = await fetchGeminiAPI();
        clearInterval(timerInterval);
        document.getElementById("timer-container").innerText = ((performance.now() - startTime) / 1000).toFixed(1) + "秒";

        if (aiResponseText !== null) {
            let currentPersona = personaSelect.value;
            let newLogAi = {
                id: Date.now(),
                app_type: "chat",
                sender: currentPersona,
                time: getFormattedTime(),
                text: aiResponseText,
                attachedFiles: [],
                tags: [],
                memo: "",
                status: "published",
                linked_ids: [],
                updated_at: Date.now()
            };
            chatLogArray.push(newLogAi);
            sessionWaltzCount++; localStorage.setItem(WALTZ_COUNT_VAULT, sessionWaltzCount);
            appendLogElement(chatLogArray.length - 1);
            
            // Firebaseへ投下
            setDoc(doc(db, "records", newLogAi.id.toString()), newLogAi).catch(e => console.error(e));
        }

        enforceMemoryLimit();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(chatLogArray));
        sendBtn.disabled = false; sendBtn.innerText = "送 信";
    };

    // --- Buttons Actions ---
    document.querySelectorAll('.btn-action-save').forEach(function(btn) {
        btn.onclick = async function() {
            let targetId = this.getAttribute('data-target');
            let personaId = personaSelect.value;
            let val = document.getElementById(targetId).value;
            let originalText = this.innerText; 
            this.innerText = "通信中...";
            try {
                let docRef = doc(db, "records", "persona_" + personaId);
                let docSnap = await getDoc(docRef);
                let data = {};
                if (targetId === "sys-prompt") data.sys_prompt = val;
                if (targetId === "saved-info") data.saved_info = val;
                data.updated_at = Date.now();
                
                if (docSnap.exists()) { await updateDoc(docRef, data); } 
                else {
                    data.id = "persona_" + personaId;
                    data.app_type = "system_config";
                    data.persona_name = personaId;
                    await setDoc(docRef, data);
                }
                this.innerText = "保存完了"; this.style.backgroundColor = "#27ae60"; 
                setTimeout(() => { this.innerText = originalText; this.style.backgroundColor = "#2980b9"; }, 1500);
            } catch (e) {
                console.error(e); this.innerText = "失敗"; setTimeout(() => { this.innerText = originalText; }, 1500);
            }
        };
    });
    
    document.querySelectorAll('.btn-action-clear').forEach(function(btn) {
        btn.onclick = function() {
            let targetId = this.getAttribute('data-target');
            if (confirm("この領域のテキストを消去してよろしいですか？")) {
                document.getElementById(targetId).value = "";
            }
        };
    });

    document.getElementById("copy-checked-btn").onclick = function() {
        let checked = Array.from(document.querySelectorAll(".log-checkbox:checked")); if(!checked.length) return;
        let copyText = checked.map(cb => {
            let log = chatLogArray[cb.value];
            let senderName = log.sender === "User" ? "船長：" : log.sender + "：";
            return "【" + log.time + "】 " + senderName + "\n" + log.text;
        }).join("\n\n---\n");
        navigator.clipboard.writeText(copyText).then(() => { alert(checked.length + "件をコピーしました。"); closeAllSidebars(); });
    };

    document.getElementById("delete-checked-btn").onclick = async function() {
        let checked = Array.from(document.querySelectorAll(".log-checkbox:checked")); if (!checked.length) return;
        if (confirm(checked.length + "件の歴史を削除しますか？(Firebase上は論理削除)")) {
            let targetIndices = new Set(checked.map(cb => parseInt(cb.value, 10)));
            for (let idx of targetIndices) {
                let logId = chatLogArray[idx].id;
                if (logId) updateDoc(doc(db, "records", logId.toString()), { status: "deleted", updated_at: Date.now() }).catch(e=>console.error(e));
            }
            chatLogArray = chatLogArray.filter((_, idx) => !targetIndices.has(idx)); 
            enforceMemoryLimit(); localStorage.setItem(STORAGE_KEY, JSON.stringify(chatLogArray)); renderLogs(); closeAllSidebars();
        }
    };

    document.getElementById("reset-meter-btn").onclick = function() {
        if (confirm("ワルツメーターをゼロにリセットしますか？")) {
            sessionWaltzCount = 0; localStorage.setItem(WALTZ_COUNT_VAULT, 0); updateRadar();
        }
    };
    
    document.getElementById("save-key-btn").onclick = function() { let key = document.getElementById("api-key-input").value; if (key && key !== "********") { localStorage.setItem(API_KEY_VAULT, key); document.getElementById("api-key-input").value = "********"; alert("保存完了"); } };
    document.getElementById("delete-key-btn").onclick = function() { localStorage.removeItem(API_KEY_VAULT); document.getElementById("api-key-input").value = ""; alert("消去完了"); };

    document.getElementById("undo-btn").onclick = function() {
        if (chatLogArray.length === 0) return;
        let lastLog = chatLogArray.pop();
        if (lastLog.id) updateDoc(doc(db, "records", lastLog.id.toString()), { status: "deleted", updated_at: Date.now() }).catch(e=>console.error(e));
        
        if (lastLog.sender !== "User" && chatLogArray.length > 0 && chatLogArray[chatLogArray.length - 1].sender === "User") {
            let userLog = chatLogArray.pop();
            if (userLog.id) updateDoc(doc(db, "records", userLog.id.toString()), { status: "deleted", updated_at: Date.now() }).catch(e=>console.error(e));
            sessionWaltzCount = Math.max(0, sessionWaltzCount - 1);
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(chatLogArray)); localStorage.setItem(WALTZ_COUNT_VAULT, sessionWaltzCount); renderLogs(); closeAllSidebars();
    };

    document.getElementById("reset-btn").onclick = function() {
        if (confirm("金庫を完全に空にしますか？ (ローカル表示のみクリア)")) { 
            chatLogArray = []; sessionWaltzCount = 0; localStorage.removeItem(STORAGE_KEY); localStorage.setItem(WALTZ_COUNT_VAULT, 0); renderLogs(); closeAllSidebars(); 
        }
    };

    document.getElementById("chunk-export-btn").onclick = function() {
        if (chatLogArray.length === 0) { alert("退避する歴史がありません。"); return; }
        let chunkLogs = []; let charCount = 0; let splitIndex = 0;
        for (let i = 0; i < chatLogArray.length; i++) {
            charCount += chatLogArray[i].text.length; chunkLogs.push(chatLogArray[i]); splitIndex = i + 1;
            if (charCount >= 50000 && chatLogArray[i].sender !== "User") break;
        }
        if (charCount < 30000 && chatLogArray.length === chunkLogs.length) {
            if (!confirm("まだ5万字に達していません。全ての履歴を退避しますか？")) return;
        } else {
            if (!confirm("最古の対話からチャンク化し、母艦の記憶から切り離して退避しますか？")) return;
        }
        let nowStr = getFormattedTime().replace(/[^0-9]/g, "");
        let url = URL.createObjectURL(new Blob([JSON.stringify(chunkLogs, null, 2)], { type: 'application/json' }));
        let a = document.createElement("a"); a.href = url; a.download = "chunk_20号_" + nowStr + ".json"; a.click(); URL.revokeObjectURL(url);
        
        chatLogArray.splice(0, splitIndex);
        enforceMemoryLimit(); localStorage.setItem(STORAGE_KEY, JSON.stringify(chatLogArray)); renderLogs(); closeAllSidebars();
        alert("退避が完了しました！");
    };

</script>
</body>
</html>
