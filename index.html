<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>マザーファイル：第18号（PWA・自律母艦仕様・分離ウィンドウ）改</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body { display: flex; flex-direction: column; background-color: #f4f4f5; color: #595959; height: 100dvh; }
        header, #control-area, #sidebar-console { -webkit-user-select: none; user-select: none; }
        header { height: 50px; flex: none; background-color: #2c3e50; color: #ffffff; display: flex; justify-content: flex-end; align-items: center; padding: 0 15px; font-size: 14px; font-weight: bold; position: relative; z-index: 30; }
        #log-window { flex: 1; background-color: #ffffff; padding: 20px; overflow-y: auto; border-bottom: 2px solid #bdc3c7; }
        .log-user, .log-ai { font-family: "MS UI Gothic", "Yu Gothic UI", "Meiryo UI", sans-serif; font-size: 16px; line-height: 1.6; padding-bottom: 25px; margin-bottom: 25px; }
        .log-meta { font-size: 12px; color: #95a5a6; margin-bottom: 5px; font-family: sans-serif; display: flex; align-items: center; gap: 5px; }
        .log-checkbox { width: 14px; height: 14px; cursor: pointer; }
        #input-window { min-height: 70px; flex: none; padding: 10px; background-color: #ecf0f1; display: flex; flex-direction: column; border-top: 1px solid #bdc3c7; }
        textarea#main-input { flex-grow: 1; resize: none; padding: 10px; font-size: 16px; border: 1px solid #95a5a6; border-radius: 5px; color: #595959; outline: none; transition: border-color 0.2s, box-shadow 0.2s; overflow-y: hidden; line-height: 1.5; }
        textarea#main-input:focus { border-color: #2e648c; box-shadow: 0 0 0 2px rgba(46, 100, 140, 0.2); }
        #control-area { height: auto; flex: none; background-color: #ecf0f1; display: flex; justify-content: space-between; align-items: stretch; padding: 0 10px 15px 10px; gap: 15px; }
        #radar-panel { display: flex; gap: 10px; font-family: sans-serif; font-size: 12px; color: #595959; flex: 1; align-items: center; }
        .radar-col { display: flex; flex-direction: column; gap: 5px; }
        .radar-item { background: #e0e6ed; padding: 6px 8px; border-radius: 4px; font-weight: bold; white-space: nowrap; }
        .btn-group { display: flex; gap: 10px; flex: none; width: 80px; }
        button { cursor: pointer; font-size: 14px; font-weight: bold; border: none; border-radius: 5px; transition: background-color 0.2s; }
        button:disabled { background-color: #7f8c8d !important; cursor: not-allowed; color: #fff !important; }
        .btn-send { background-color: #2980b9; color: #ffffff; flex: 1; font-size: 14px; }
        
        #sidebar-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background-color: rgba(0,0,0,0.5); z-index: 35; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s; }
        #sidebar-overlay.open { opacity: 1; visibility: visible; }
        #sidebar-console { position: fixed; top: 0; left: -300px; width: 300px; height: 100dvh; background-color: #34495e; color: white; transition: left 0.3s ease; z-index: 40; padding: 20px; display: flex; flex-direction: column; gap: 15px; box-shadow: 2px 0 5px rgba(0,0,0,0.5); overflow-y: auto; font-family: sans-serif; }
        #sidebar-console.open { left: 0; }
        
        .console-section { border-bottom: 1px solid #7f8c8d; padding-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        .console-section:last-child { border-bottom: none; }
        .console-title { font-size: 14px; color: #ecf0f1; font-weight: bold; }
        .btn-warning { background-color: #f39c12; color: #fff; padding: 12px; border-radius: 5px; width: 100%; text-align: center; }
        .btn-danger { background-color: #c0392b; color: #fff; padding: 12px; border-radius: 5px; width: 100%; text-align: center; }
        .btn-small { background-color: #2980b9; padding: 10px; border-radius: 5px; flex: 1; border: none; color: white; cursor: pointer; text-align: center; font-size: 13px; }
        .console-textarea { width: 100%; height: 150px; resize: none; padding: 8px; border-radius: 5px; border: none; font-size: 13px; background: #ecf0f1; color: #2c3e50; }
        input[type=password], input[type=month], input[type=file] { width: 100%; padding: 10px; border-radius: 5px; border: none; font-size: 13px; background: #ecf0f1; color: #2c3e50; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; padding: 10px 0; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #3498db; cursor: pointer; margin-top: -7px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #7f8c8d; border-radius: 2px; }
    </style>
</head>
<body>

    <div id="sidebar-overlay"></div>
    <div id="sidebar-console">
        <div class="console-section">
            <div class="console-title">API認証</div>
            <input type="password" id="api-key-input" placeholder="APIキーを入力">
            <div style="display: flex; gap: 8px;">
                <button class="btn-small" id="save-key-btn">保存</button>
                <button class="btn-small" style="background: #7f8c8d;" id="delete-key-btn">消去</button>
            </div>
        </div>
        <div class="console-section">
            <div class="console-title">思考温度 (Temp)</div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <input type="range" id="temp-slider" min="0.0" max="2.0" step="0.1" value="1.0" style="flex: 1;">
                <span id="temp-value" style="font-weight: bold; font-size: 16px; color: #3498db; width: 30px; text-align: right;">1.0</span>
            </div>
        </div>
        <div class="console-section">
            <div class="console-title">システムプロンプト（絶対法則）</div>
            <textarea id="system-prompt-input" class="console-textarea" placeholder="絶対法則を入力"></textarea>
            <button class="btn-small" id="save-prompt-btn" style="width: 100%;">プロンプト固定</button>
        </div>
        <div class="console-section">
            <div class="console-title">アーカイブ搬出 (指定月)</div>
            <input type="month" id="export-month-input">
            <button class="btn-small" id="export-btn" style="width: 100%;">JSONとして書き出し</button>
        </div>
        <div class="console-section">
            <div class="console-title">歴史の搬入</div>
            <input type="file" id="import-file-input" accept=".json">
            <button class="btn-small" id="import-btn" style="width: 100%;">JSONとして搬入</button>
        </div>
        <div class="console-section">
            <div class="console-title">ログ管理</div>
            <button class="btn-warning" id="undo-btn">一手やり直し (Undo)</button>
            <button class="btn-small" id="copy-checked-btn" style="background: #2c3e50; border: 1px solid #7f8c8d;">チェック項目をコピー</button>
            <button class="btn-small" id="delete-checked-btn" style="background: #c0392b;">チェック項目を削除</button>
            <button class="btn-danger" id="reset-btn" style="margin-top: 15px;">全ログ強制消去</button>
        </div>
    </div>

    <header>
        <div id="secretary-name">穂積かなえ主席書記官</div>
    </header>

    <div id="log-window"></div>

    <div id="input-window">
        <textarea id="main-input" placeholder="こちらにプロトコルを入力してください" rows="1"></textarea>
    </div>

    <div id="control-area">
        <div id="radar-panel">
            <button id="toggle-console-btn" style="background: #34495e; color: white; border: none; border-radius: 4px; padding: 0 12px; height: 100%; font-size: 18px; font-weight: bold; cursor: pointer; flex: none;">≡</button>
            
            <div class="radar-col" style="margin-left: 5px;">
                <div class="radar-item">ワルツ: <span id="radar-waltz">0</span></div>
                <div class="radar-item">文字数: <span id="radar-chars">0</span></div>
            </div>
            <div class="radar-col">
                <div class="radar-item">入力: <span id="radar-input-tokens">0</span></div>
                <div class="radar-item">出力: <span id="radar-output-tokens">0</span></div>
            </div>
            
            <button id="reset-meter-btn" style="font-size:10px; padding:3px 8px; border:1px solid #bdc3c7; border-radius:3px; background:#fff; color:#595959; height: fit-content; align-self: center;">ﾘｾｯﾄ</button>
            
            <div style="display:flex; align-items:center; margin-left:auto;">
                <b id="timer" style="color:#2980b9; font-size:14px; white-space:nowrap;">0.0秒</b>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn-send">送 信</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js').then(function(registration) {
                    console.log('ServiceWorker 登録成功: ', registration.scope);
                }, function(err) {
                    console.log('ServiceWorker 登録失敗: ', err);
                });
            });
        }

        if (window.visualViewport) {
            function updateBodyHeight() {
                document.body.style.height = window.visualViewport.height + "px";
                window.scrollTo(0, 0); 
            }
            window.visualViewport.addEventListener("resize", function() {
                updateBodyHeight(); 
                setTimeout(function() {
                    updateBodyHeight();
                    document.getElementById("control-area").scrollIntoView(false);
                }, 400);
            });
            document.getElementById("main-input").addEventListener("focus", function() {
                setTimeout(function() {
                    document.getElementById("control-area").scrollIntoView(false);
                }, 400);
            });
            updateBodyHeight();
        }

        var STORAGE_KEY = "fleet_v18";
        var API_KEY_VAULT = "gemini_api_key";
        var SYSTEM_PROMPT_VAULT = "gemini_system_prompt";
        var TOKEN_VAULT = "gemini_out_tokens";
        var INPUT_TOKEN_VAULT = "gemini_in_tokens";
        var WALTZ_COUNT_VAULT = "gemini_waltz_count";
        
        var CHAR_LIMIT = 200000;
        
        var chatLogArray = [];
        var totalOutputTokens = 0;
        var totalInputTokens = 0;
        var sessionWaltzCount = 0;

        var logArea = document.getElementById("log-window");
        var inputArea = document.getElementById("main-input");
        var sendBtn = document.querySelector(".btn-send");
        var consolePanel = document.getElementById("sidebar-console");
        var overlay = document.getElementById("sidebar-overlay");

        function openSidebar() {
            consolePanel.classList.add("open");
            overlay.classList.add("open");
        }
        function closeSidebar() {
            consolePanel.classList.remove("open");
            overlay.classList.remove("open");
        }

        document.getElementById("toggle-console-btn").onclick = openSidebar;
        overlay.onclick = closeSidebar;

        // タッチスワイプ操作の実装
        var touchStartX = 0;
        var touchStartY = 0;
        var touchEndX = 0;
        var touchEndY = 0;

        document.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: true});

        document.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            var xDiff = touchStartX - touchEndX;
            var yDiff = Math.abs(touchStartY - touchEndY);
            if (yDiff > Math.abs(xDiff)) return; // 縦スクロール時は無視

            if (xDiff > 50 && consolePanel.classList.contains("open")) {
                closeSidebar(); // 左スワイプで閉じる
            } else if (xDiff < -50 && touchStartX < 30 && !consolePanel.classList.contains("open")) {
                openSidebar(); // 画面左端からの右スワイプで開く
            }
        }

        inputArea.addEventListener('input', function() {
            this.style.height = 'auto'; 
            this.style.height = this.scrollHeight + 'px'; 
        });

        // Ctrl+Enter / Cmd+Enter での送信ショートカット
        inputArea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                if (!sendBtn.disabled) sendBtn.click();
            }
        });

        function getFormattedTime() {
            var now = new Date();
            var yyyy = now.getFullYear();
            var mm = ("0" + (now.getMonth() + 1)).slice(-2);
            var dd = ("0" + now.getDate()).slice(-2);
            var dayStr = ["日", "月", "火", "水", "木", "金", "土"][now.getDay()];
            var hh = ("0" + now.getHours()).slice(-2);
            var min = ("0" + now.getMinutes()).slice(-2);
            return yyyy + "/" + mm + "/" + dd + "(" + dayStr + ") " + hh + ":" + min;
        }

        function updateRadar() {
            var totalChars = chatLogArray.reduce((acc, log) => acc + log.text.length, 0);
            document.getElementById("radar-waltz").innerText = sessionWaltzCount;
            document.getElementById("radar-chars").innerText = totalChars.toLocaleString();
            document.getElementById("radar-input-tokens").innerText = totalInputTokens.toLocaleString();
            document.getElementById("radar-output-tokens").innerText = totalOutputTokens.toLocaleString();
        }

        function enforceMemoryLimit() {
            var STORAGE_LIMIT = 2000000; 
            var totalChars = chatLogArray.reduce((acc, log) => acc + log.text.length, 0);
            while (totalChars > STORAGE_LIMIT && chatLogArray.length >= 2) {
                var dropped1 = chatLogArray.shift();
                var dropped2 = chatLogArray.shift();
                totalChars -= (dropped1.text.length + dropped2.text.length);
                console.log("【ストレージ防衛】限界容量超過。最古のワルツを揮発させました。");
            }
        }

        async function fetchGeminiAPI() {
            var apiKey = localStorage.getItem(API_KEY_VAULT);
            if (!apiKey) { alert("APIキーがありません。"); return null; }

            var API_WINDOW_LIMIT = 100000;
            var sendLogs = [];
            var charCount = 0;
            for (var i = chatLogArray.length - 1; i >= 0; i--) {
                charCount += chatLogArray[i].text.length;
                if (charCount > API_WINDOW_LIMIT && sendLogs.length > 0) break;
                sendLogs.unshift(chatLogArray[i]);
            }

            while (sendLogs.length > 0 && sendLogs[0].sender !== "船長") {
                sendLogs.shift();
            }
            if (sendLogs.length === 0) return null;

            var geminiContents = [];
            sendLogs.forEach(function(log) {
                var role = log.sender === "船長" ? "user" : "model";
                var timeStr = log.time ? "【" + log.time + "】\n" : "";
                var currentText = timeStr + log.text;

                var lastContent = geminiContents[geminiContents.length - 1];
                if (lastContent && lastContent.role === role) {
                    lastContent.parts[0].text += "\n\n" + currentText;
                } else {
                    geminiContents.push({ role: role, parts: [{ text: currentText }] });
                }
            });

            if (geminiContents.length > 0 && geminiContents[geminiContents.length - 1].role !== "user") {
                geminiContents.pop();
            }
            if (geminiContents.length === 0) return null;

            var requestBody = { contents: geminiContents, tools: [{ googleSearch: {} }] };

            var savedPrompt = localStorage.getItem(SYSTEM_PROMPT_VAULT);
            if (savedPrompt && savedPrompt.trim() !== "") {
                requestBody.systemInstruction = { parts: [{ text: savedPrompt }] };
            }

            requestBody.generationConfig = { temperature: parseFloat(document.getElementById("temp-slider").value) };
            var url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-pro-preview:generateContent?key=" + apiKey;

            try {
                var response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });
                var data = await response.json();

                if (data.error) {
                    alert("APIからの拒否理由: " + data.error.message);
                    return null;
                }
                if (!data.candidates || !data.candidates[0].content || !data.candidates[0].content.parts) {
                    alert("異常データ受信: " + JSON.stringify(data).substring(0, 300));
                    return null;
                }            

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    if (data.usageMetadata) {
                        if (data.usageMetadata.candidatesTokenCount) {
                            totalOutputTokens += data.usageMetadata.candidatesTokenCount;
                            localStorage.setItem(TOKEN_VAULT, totalOutputTokens);
                        }
                        if (data.usageMetadata.promptTokenCount) {
                            totalInputTokens += data.usageMetadata.promptTokenCount;
                            localStorage.setItem(INPUT_TOKEN_VAULT, totalInputTokens);
                        }
                    }
                    return data.candidates[0].content.parts[0].text;
                } else {
                    return "システム警告：応答を解析できません。";
                }
            } catch (error) {
                return "通信沈黙：Googleサーバーへの接続に失敗しました。";
            }
        }

        function renderLogs() {
            logArea.innerHTML = ""; 
            if (chatLogArray.length === 0) {
                logArea.innerHTML = '<p style="font-size: 12px; color: #95a5a6;">システム起動：対話ログ待機中...</p>';
                updateRadar();
                return;
            }
            chatLogArray.forEach(function(log, index) {
                var wrapper = document.createElement("div");
                wrapper.className = log.sender === "船長" ? "log-user" : "log-ai";
                var meta = document.createElement("div");
                meta.className = "log-meta";
                
                var cb = document.createElement("input");
                cb.type = "checkbox"; 
                cb.className = "log-checkbox"; 
                cb.value = index;
                meta.appendChild(cb);
                
                var span = document.createElement("span");
                if (log.sender === "船長") {
                    span.innerHTML = (log.time || "") + " 船長：";
                } else {
                    span.innerHTML = (log.time || "") + " かなえ：";
                }
                meta.appendChild(span);

                var textNode = document.createElement("div");
                textNode.style.whiteSpace = "pre-wrap";
                textNode.innerText = log.text;
                
                wrapper.appendChild(meta);
                wrapper.appendChild(textNode);
                logArea.appendChild(wrapper);
            });
            logArea.scrollTop = logArea.scrollHeight;
            updateRadar();
        }

        window.onload = function() {
            var savedJSON = localStorage.getItem(STORAGE_KEY);
            if (savedJSON) chatLogArray = JSON.parse(savedJSON);
            
            var savedTokens = localStorage.getItem(TOKEN_VAULT);
            if (savedTokens) totalOutputTokens = parseInt(savedTokens);

            var savedInTokens = localStorage.getItem(INPUT_TOKEN_VAULT);
            if (savedInTokens) totalInputTokens = parseInt(savedInTokens);

            var savedWaltz = localStorage.getItem(WALTZ_COUNT_VAULT);
            if (savedWaltz) sessionWaltzCount = parseInt(savedWaltz);

            renderLogs();
            if (localStorage.getItem(API_KEY_VAULT)) document.getElementById("api-key-input").value = "********"; 
            if (localStorage.getItem(SYSTEM_PROMPT_VAULT)) document.getElementById("system-prompt-input").value = localStorage.getItem(SYSTEM_PROMPT_VAULT);
        };

        document.getElementById("copy-checked-btn").onclick = function() {
            var checked = Array.from(document.querySelectorAll(".log-checkbox:checked"));
            if(!checked.length) return;
            var txt = checked.map(cb => chatLogArray[cb.value].text).join("\n\n---\n");
            navigator.clipboard.writeText(txt).then(() => {
                alert(checked.length + "件の歴史をコピーしました。");
                closeSidebar();
            });
        };

        document.getElementById("delete-checked-btn").onclick = function() {
            var checked = Array.from(document.querySelectorAll(".log-checkbox:checked"));
            if (!checked.length) return;
            if (confirm(checked.length + "件の歴史を削除しますか？")) {
                var targetIndices = new Set(checked.map(cb => parseInt(cb.value, 10)));
                chatLogArray = chatLogArray.filter((_, idx) => !targetIndices.has(idx));
                enforceMemoryLimit();
                localStorage.setItem(STORAGE_KEY, JSON.stringify(chatLogArray));
                renderLogs();
                closeSidebar();
            }
        };

        document.getElementById("reset-meter-btn").onclick = function() {
            if (confirm("トークンとワルツのメーターをゼロにリセットしますか？（歴史は保持されます）")) {
                totalOutputTokens = 0; localStorage.setItem(TOKEN_VAULT, 0);
                totalInputTokens = 0; localStorage.setItem(INPUT_TOKEN_VAULT, 0);
                sessionWaltzCount = 0; localStorage.setItem(WALTZ_COUNT_VAULT, 0);
                updateRadar();
            }
        };

        document.getElementById("save-key-btn").onclick = function() {
            var key = document.getElementById("api-key-input").value;
            if (key && key !== "********") { localStorage.setItem(API_KEY_VAULT, key); document.getElementById("api-key-input").value = "********"; alert("保存完了"); }
        };
        
        document.getElementById("delete-key-btn").onclick = function() { localStorage.removeItem(API_KEY_VAULT); document.getElementById("api-key-input").value = ""; alert("消去完了"); };
        document.getElementById("temp-slider").oninput = function() { document.getElementById("temp-value").innerText = parseFloat(this.value).toFixed(1); };
        document.getElementById("save-prompt-btn").onclick = function() {
            localStorage.setItem(SYSTEM_PROMPT_VAULT, document.getElementById("system-prompt-input").value);
            alert("大号令をシステムに固定しました。");
        };

        document.getElementById("export-btn").onclick = function() {
            var monthVal = document.getElementById("export-month-input").value; 
            if (!monthVal) { alert("年月を指定してください。"); return; }
            var targetPrefix = monthVal.replace("-", "/"); 

            var exportData = chatLogArray.filter(log => log.time && log.time.startsWith(targetPrefix));
            if (exportData.length === 0) { alert("該当する月のデータがありません。"); return; }

            var blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = "log_" + monthVal + ".json";
            a.click();
            URL.revokeObjectURL(url);
        };

        document.getElementById("import-btn").onclick = function() {
            var file = document.getElementById("import-file-input").files[0];
            if (!file) { alert("ファイルを選択してください。"); return; }
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var importedData = JSON.parse(e.target.result);
                    if (!Array.isArray(importedData)) throw new Error("無効な形式です");
                    if (confirm("現在のログと照合し、未知の歴史（差分）だけを追加しますか？")) {
                        importedData.forEach(function(iLog) {
                            var isExist = chatLogArray.some(function(eLog) {
                                return eLog.time === iLog.time && eLog.sender === iLog.sender && eLog.text === iLog.text;
                            });
                            if (!isExist) chatLogArray.push(iLog);
                        });
                        chatLogArray.sort(function(a, b) {
                            return a.time.localeCompare(b.time);
                        });
                        enforceMemoryLimit();
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(chatLogArray));
                        renderLogs();
                        alert("歴史の差分統合が完了しました！");
                    }
                } catch(err) {
                    alert("ファイルの読み込みに失敗しました。");
                }
            };
            reader.readAsText(file);
        };

        document.getElementById("undo-btn").onclick = function() {
            if (chatLogArray.length >= 2) { 
                chatLogArray.pop(); 
                chatLogArray.pop(); 
                sessionWaltzCount = Math.max(0, sessionWaltzCount - 1); 
                localStorage.setItem(STORAGE_KEY, JSON.stringify(chatLogArray)); 
                localStorage.setItem(WALTZ_COUNT_VAULT, sessionWaltzCount);
                renderLogs(); 
                closeSidebar();
            } else if (chatLogArray.length === 1) {
                chatLogArray.pop();
                sessionWaltzCount = 0;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(chatLogArray)); 
                localStorage.setItem(WALTZ_COUNT_VAULT, sessionWaltzCount);
                renderLogs();
                closeSidebar();
            }
        };

        document.getElementById("reset-btn").onclick = function() {
            if (confirm("金庫を完全に空にしますか？")) { 
                chatLogArray = []; 
                sessionWaltzCount = 0;
                localStorage.removeItem(STORAGE_KEY); 
                localStorage.setItem(WALTZ_COUNT_VAULT, 0);
                renderLogs(); 
                closeSidebar();
            }
        };

        sendBtn.onclick = async function() {
            var text = inputArea.value;
            if (text !== "") {
                sendBtn.disabled = true; sendBtn.innerText = "通信中..."; 
                let startTime = performance.now();
                chatLogArray.push({ sender: "船長", time: getFormattedTime(), text: text });
                enforceMemoryLimit();
                localStorage.setItem(STORAGE_KEY, JSON.stringify(chatLogArray));
                renderLogs();
                inputArea.value = "";
                inputArea.style.height = 'auto';

                var aiResponseText = await fetchGeminiAPI();
                if (aiResponseText !== null) {
                    chatLogArray.push({ sender: "AI", time: getFormattedTime(), text: aiResponseText });
                    enforceMemoryLimit();
                    
                    sessionWaltzCount++;
                    localStorage.setItem(WALTZ_COUNT_VAULT, sessionWaltzCount);
                    
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(chatLogArray));
                    renderLogs();
                }
                let endTime = performance.now();
                document.getElementById("timer").innerText = ((endTime - startTime) / 1000).toFixed(1) + "秒";
                sendBtn.disabled = false; sendBtn.innerText = "送 信";
            }
        };
    </script>
</body>
</html>
